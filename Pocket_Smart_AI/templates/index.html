<!doctype html>

<html lang="en">

<head>

    >

        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<nav>

        class="brand"
        href="/"
    >

    </a>

        </a>

        </button>
